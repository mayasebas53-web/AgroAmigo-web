<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroAmigo - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-toast" class="login-toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <div class="login-container">
        <h1>🌱 AgroAmigo</h1>
        <p>Inicia sesión para gestionar tus plantas</p>
        
        <form id="login-form" action="login.php" method="post" novalidate>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="usuario@correo.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="account-prompt">¿No tienes una cuenta? <a href="signup.html">Crear una cuenta</a></p>
    </div>

    <script>
        const toast = document.getElementById('login-toast');
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const messages = {
            missing_email: 'Escribe tu correo electrónico para continuar.',
            missing_password: 'Escribe tu contraseña para continuar.',
            invalid_email: 'El correo debe tener el formato nombre@dominio.com.',
            email_not_found: 'No encontramos ninguna cuenta con este correo.',
            incorrect_password: 'La contraseña es incorrecta.',
            server_error: 'Algo salió mal, inténtalo de nuevo en unos minutos.',
            registered: 'Cuenta creada correctamente. Ya puedes iniciar sesión.'
        };

        const params = new URLSearchParams(window.location.search);
        const errorKey = params.get('error');
        const registered = params.get('registered');

        if (params.has('email')) {
            emailInput.value = params.get('email') || '';
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            window.setTimeout(() => toast.classList.remove('show'), 6500);
        }

        if (errorKey && messages[errorKey]) {
            showToast(messages[errorKey]);
        } else if (registered === '1') {
            showToast(messages.registered);
        }

        form.addEventListener('submit', (event) => {
            const passwordInput = document.getElementById('password');
            let message = '';

            if (!emailInput.value.trim()) {
                message = messages.missing_email;
            } else if (!emailInput.validity.valid) {
                message = messages.invalid_email;
            } else if (!passwordInput.value) {
                message = messages.missing_password;
            }

            if (message) {
                event.preventDefault();
                showToast(message);
                (message === messages.missing_email || message === messages.invalid_email ? emailInput : passwordInput).focus();
            }
        });

        if (errorKey || registered) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
